server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/(?<segment>.*), /api/v1/auth/${segment}

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/users/**
          filters:
            - RewritePath=/users/(?<segment>.*), /api/v1/users/${segment}

        - id: message-service
          uri: http://localhost:8083
          predicates:
            - Path=/message/**
          filters:
            - RewritePath=/message/(?<segment>.*), /api/v1/message/${segment}